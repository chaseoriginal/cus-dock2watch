services:
  dockwatch:
    container_name: ${container_name}
    image: ghcr.io/notifiarr/dockwatch:main
    ports:
            - ${IP}:${ext_port}:${http_port}/tcp
    environment:
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /var/lib/docker/volumes/dockwatch/config:/config
      - /var/run/docker.sock:/var/run/docker.sock